services:
  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: applycopilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - applycopilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

volumes:
  redis_data:
    driver: local

networks:
  applycopilot-network:
    driver: bridge
