openapi: 3.0.3
info:
  title: ApplyCopilot REST API (Phase 1)
  description: API Contracts for Authentication and CV Import pipelines in ApplyCopilot V2.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  example: securepassword123
      responses:
        '200':
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
        '400':
          description: Validation errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                        example: ["Invalid email address"]
                      password:
                        type: array
                        items:
                          type: string
                        example: ["String must contain at least 6 characters"]

  /api/auth/forgot-password:
    post:
      summary: Request password reset link
      description: Generates a secure hashed token and sends a reset link to the user via Resend (or logs to debug folder in dev mode). Rate limit is 3 requests per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Link sent or simulated. For security, this is also returned if the email doesn't exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: If the email exists, a reset link has been sent
        '429':
          description: Rate limit hit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Too many password reset requests. Please try again in an hour.

  /api/auth/reset-password:
    post:
      summary: Reset password using token
      description: Validates the plaintext token against the stored SHA-256 hash and updates the user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  example: 74f493b4426b5856f7bcc7c6c8c7...
                password:
                  type: string
                  minLength: 6
                  example: newsecurepassword456
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password reset successfully
        '400':
          description: Invalid or expired token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid or expired reset token

  /api/profile/parse:
    post:
      summary: Upload CV and stream parsed AI profile segments
      description: Server-Sent Events (SSE) endpoint. Receives PDF/DOCX file, extracts text, performs rate limit validation (max 5/day), parses career history sequentially, and returns live progress events.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The resume file (PDF or DOCX, max 5MB)
      responses:
        '200':
          description: SSE Stream established. Streams chunks of `ParseProgressEvent` data.
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache, no-transform
            Connection:
              schema:
                type: string
                example: keep-alive
        '401':
          description: Unauthorized. Active session cookie required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '429':
          description: Rate limit reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Rate limit reached. You can only parse 5 resumes per day.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Session cookie generated by NextAuth.js
